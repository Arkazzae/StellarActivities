name: Contribution checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commits and pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          msg=$(mktemp)
          if [ -n "$TITLE" ]; then
            printf '%s\n' "$TITLE" > "$msg"
            .githooks/commit-msg "$msg"
          fi
          range="$HEAD"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            range="$BASE..$HEAD"
          fi
          git rev-list "$range" > "$msg.commits"
          while read -r commit; do
            git show -s --format='%B%n%an <%ae>%n%cn <%ce>' "$commit" > "$msg"
            .githooks/commit-msg "$msg"
          done < "$msg.commits"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Check release tooling
        run: node --test scripts/test/*.test.mjs
      - name: Test and package affected activities
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/changed-activities.mjs "$BASE" > "$RUNNER_TEMP/activities"
          while read -r id; do
            bash scripts/check-activity.sh "$id"
          done < "$RUNNER_TEMP/activities"
