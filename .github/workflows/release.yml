name: Release activities
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Test activities
        run: |
          node --test */test/*.test.mjs
      - name: Build the installable release
        run: node scripts/package-release.mjs
      - name: Verify archives
        run: |
          for archive in dist/*.zip; do unzip -t "$archive"; done
      - name: Publish the archive and release index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/stellarr-release.json --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"
