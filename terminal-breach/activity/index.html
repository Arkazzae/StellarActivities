<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Terminal Breach</title>
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="game-root">
    <video id="bg-video" autoplay muted playsinline loop preload="auto" aria-hidden="true" src="./assets/background-loop.mp4"></video>
    <main id="game-container">
      <div class="shell">
        <div id="screen"></div>
      </div>
      <div class="crt-interference" aria-hidden="true"></div>
      <div id="connection-banner" role="status" hidden></div>
      <div id="toast-container" role="status"></div>
    </main>
  </div>
  <script src="./libraries/howler.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
